name: generate stats cards

on:
  # run automatically every day
  schedule:
    - cron: "17 3 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # generate the GitHub stats card (self-hosted, no third-party service)
      - name: generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0d1117&title_color=8CA6DB&icon_color=B993D6&text_color=C9D1D9'
          path: src/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # generate the top languages card
      - name: generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0d1117&title_color=8CA6DB&text_color=C9D1D9'
          path: src/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # commit the generated cards back to the repo
      - name: commit stats cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stats.svg src/top-langs.svg
          git commit -m "chore: update stats cards" || exit 0
          git push
